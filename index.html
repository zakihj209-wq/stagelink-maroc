<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StageLink Maroc — Stage & CV</title>

<style>
:root{
  --blue:#2457e6;
  --blue2:#163da8;
  --ink:#101828;
  --muted:#667085;
  --line:#e5eaf2;
  --soft:#f5f7fb;
  --white:#fff;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  color:var(--ink);
  background:#fff;
  font-family:Arial,sans-serif;
  line-height:1.55
}
h1,h2,h3{line-height:1.15;margin:0 0 16px}
h1{font-size:clamp(42px,6vw,72px);letter-spacing:-3px}
h2{font-size:clamp(30px,4vw,46px)}
p{color:var(--muted)}
a{text-decoration:none;color:inherit}

.nav{
  min-height:76px;
  padding:0 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  border-bottom:1px solid var(--line);
  background:#fff;
  position:sticky;
  top:0;
  z-index:50
}
.brand{
  font-size:23px;
  font-weight:800;
  white-space:nowrap
}
.brand span{
  display:inline-grid;
  place-items:center;
  width:35px;
  height:35px;
  margin-right:5px;
  border-radius:10px;
  background:var(--blue);
  color:white
}
.nav nav{
  display:flex;
  gap:20px;
  font-size:14px;
  font-weight:600;
  color:#475467
}
.nav nav a:hover{color:var(--blue)}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:14px 21px;
  border:0;
  border-radius:11px;
  background:var(--blue);
  color:#fff;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 8px 20px #2457e633
}
.btn:hover{background:var(--blue2)}
.btn.ghost{
  background:#fff;
  color:var(--blue);
  border:1px solid #d8e0f2;
  box-shadow:none
}
.btn.small{padding:10px 15px}
.full{width:100%}

.lang{
  border:1px solid var(--line);
  background:white;
  padding:9px 12px;
  border-radius:9px;
  cursor:pointer;
  font-weight:700
}

.hero{
  padding:90px 7%;
  min-height:620px;
  background:radial-gradient(circle at 80% 20%,#dfe9ff 0,#f8faff 35%,#fff 70%);
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:60px;
  align-items:center
}
.eyebrow{
  font-size:12px;
  letter-spacing:2px;
  color:var(--blue);
  font-weight:800
}
.hero h1{margin-top:14px}
.hero h1 em{font-style:normal;color:var(--blue)}
.hero-copy>p{font-size:19px;max-width:620px}
.actions{display:flex;gap:12px;margin:28px 0;flex-wrap:wrap}

.hero-card{
  background:white;
  padding:30px;
  border:1px solid #e3e8f2;
  border-radius:22px;
  box-shadow:0 25px 70px #183b8217
}

.search-head{
  display:flex;
  justify-content:space-between;
  font-weight:800;
  font-size:19px;
  margin-bottom:18px
}
.search-head strong{color:var(--blue)}

input,select,textarea{
  width:100%;
  padding:13px 14px;
  border:1px solid #d9e0eb;
  border-radius:10px;
  background:#fff;
  color:var(--ink);
  font:inherit;
  outline:none
}
input:focus,select:focus,textarea:focus{
  border-color:#8aa7f5;
  box-shadow:0 0 0 3px #2457e614
}

.hero-card>*{margin-bottom:12px}
.hero-card small{color:var(--muted)}

.section{padding:85px 7%}
.section.alt{background:var(--soft)}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:35px
}

.steps,.offers{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px
}
.steps article,.offer{
  background:#fff;
  border:1px solid var(--line);
  padding:28px;
  border-radius:18px
}
.steps article>span{
  color:var(--blue);
  font-weight:800
}
.steps h3{margin-top:24px}

.offer{
  transition:.2s
}
.offer:hover{
  transform:translateY(-4px);
  box-shadow:0 18px 35px #1018280c
}
.tag{
  display:inline-block;
  margin-top:12px;
  background:#edf2ff;
  color:var(--blue);
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:700
}

.form-layout{
  display:grid;
  grid-template-columns:.8fr 1.2fr;
  gap:60px;
  align-items:start
}
.form-card{
  padding:30px;
  border:1px solid var(--line);
  border-radius:20px;
  background:#fff;
  box-shadow:0 15px 40px #1018280a;
  display:grid;
  gap:15px
}
.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px
}
label{
  font-size:13px;
  font-weight:700;
  color:#344054;
  display:grid;
  gap:7px
}

.cv-preview{
  display:none;
  margin-top:10px;
  padding:30px;
  border:1px solid #dfe5ef;
  background:white;
  border-radius:4px;
  min-height:400px
}
.cv-preview .cv-name{
  font-size:28px;
  font-weight:800;
  color:var(--blue)
}
.cv-preview .cv-section{
  margin-top:22px;
  border-bottom:1px solid var(--line);
  padding-bottom:8px;
  font-weight:800;
  color:var(--blue)
}

.note{
  padding:15px;
  background:var(--soft);
  border-radius:10px;
  color:var(--muted);
  font-size:13px
}

.contact{
  text-align:center;
  background:#eef3ff
}

footer{
  padding:40px 7%;
  background:#0b1220;
  color:white;
  display:flex;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap
}
footer p{color:#98a2b3}

@media(max-width:900px){
  .nav nav{display:none}
  .hero,.form-layout{grid-template-columns:1fr}
  .steps,.offers{grid-template-columns:1fr}
  .section{padding:65px 6%}
  .two{grid-template-columns:1fr}
  .hero{padding-top:60px}
  footer{flex-direction:column}
}
</style>
</head>

<body>

<header class="nav">

  <a
